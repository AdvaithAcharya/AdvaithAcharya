name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours at 00:00 UTC
    - cron: "0 0 * * *"
  # Allows manual execution from the Actions tab anytime
  workflow_dispatch:
  # Run on every push to the main branch
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Snake Animation SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: AdvaithAcharya
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300F0FF&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F0FF&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake Animation to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
